<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Santosh Kumar, Backend Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="230" rx="14"/></clipPath>
  </defs>
  <style>
    .name { font: 800 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .role { font: 600 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 1px; }
    .line { font: 500 20px 'Courier New', Consolas, monospace; fill: #f5a623; opacity: 0; animation: cycle 16s infinite backwards; }
    .l1 { animation-delay: 0s; } .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; } .l4 { animation-delay: 12s; }
    .cursor { font: 500 20px 'Courier New', Consolas, monospace; fill: #f5a623; animation: blink 1s steps(1) infinite; }
    .dot { fill: #58a6ff; animation: twinkle 3s ease-in-out infinite; }
    .scan { animation: sweep 6s linear infinite; }
    @keyframes cycle { 0% {opacity: 0; transform: translateY(6px);} 3% {opacity: 1; transform: translateY(0);} 22% {opacity: 1; transform: translateY(0);} 25% {opacity: 0; transform: translateY(-6px);} 100% {opacity: 0;} }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.9; } }
    @keyframes sweep { from { transform: translateX(-1000px); } to { transform: translateX(1000px); } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <g>
      <circle class="dot" cx="80" cy="40" r="2"/>
      <circle class="dot" cx="240" cy="190" r="2" style="animation-delay:0.7s"/>
      <circle class="dot" cx="430" cy="30" r="1.5" style="animation-delay:1.4s"/>
      <circle class="dot" cx="640" cy="200" r="2" style="animation-delay:2.1s"/>
      <circle class="dot" cx="790" cy="50" r="1.5" style="animation-delay:0.4s"/>
      <circle class="dot" cx="920" cy="150" r="2" style="animation-delay:1.1s"/>
      <circle class="dot" cx="960" cy="30" r="1.5" style="animation-delay:1.8s"/>
    </g>
    <g class="scan"><rect x="0" y="0" width="1000" height="3" fill="url(#bar)"/></g>
    <text class="name" x="60" y="95">Santosh Kumar</text>
    <text class="role" x="62" y="130">BACKEND ENGINEER  ·  DISTRIBUTED SYSTEMS  ·  AGENTIC AI</text>
    <text class="cursor" x="60" y="178">&gt;</text>
    <text class="line l1" x="85" y="178">shipped CAConnect and 20fourr to production</text>
    <text class="line l2" x="85" y="178">NestJS · TypeScript · BullMQ · Redis · AWS</text>
    <text class="line l3" x="85" y="178">event-driven systems that keep running</text>
    <text class="line l4" x="85" y="178">building AI agents on the side</text>
  </g>
</svg>
